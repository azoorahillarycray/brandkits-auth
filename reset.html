<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your password — Brand Kits</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F5F5F5;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #111111;
      padding: 24px;
    }
    .card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
    }
    .icon svg { display: block; }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px 0;
      letter-spacing: -0.02em;
      text-align: center;
    }
    p.sub {
      font-size: 14px;
      color: #888888;
      margin: 0 0 28px 0;
      text-align: center;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #111111;
    }
    input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #E5E5E5;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      color: #111111;
      outline: none;
      transition: border-color 0.15s ease;
      background: #FAFAFA;
    }
    input:focus {
      border-color: #111111;
      background: #FFFFFF;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px 24px;
      background: #111111;
      color: #FFFFFF;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
      padding: 12px 16px;
      border-radius: 10px;
      display: none;
    }
    .msg.show { display: block; }
    .msg.error {
      color: #D93025;
      background: rgba(217, 48, 37, 0.08);
      border: 1px solid rgba(217, 48, 37, 0.15);
    }
    .msg.success {
      color: #1A7F37;
      background: rgba(26, 127, 55, 0.08);
      border: 1px solid rgba(26, 127, 55, 0.15);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <h1>Set a new password</h1>
    <p class="sub">Choose something secure that you'll remember.</p>

    <form id="form">
      <label for="pw">New password</label>
      <input
        id="pw"
        type="password"
        placeholder="At least 8 characters"
        autocomplete="new-password"
        required
        minlength="8"
      />
      <button type="submit" id="submit">Update password</button>
      <div id="msg" class="msg"></div>
    </form>

    <div id="invalid" class="hidden">
      <div class="msg error show">
        This reset link is invalid or has expired. Please request a new one from the plugin.
      </div>
    </div>
  </div>

  <script>
    var SUPABASE_URL = "https://bxrqzfwddzlnfompmtwo.supabase.co"
    var SUPABASE_ANON_KEY = "sb_publishable_EyLVDO_GFLbQIkzyd7_25w_XBy3glLD"

    // Supabase appends the recovery token to the URL fragment:
    // #access_token=...&type=recovery&...
    function parseFragment(hash) {
      var params = new URLSearchParams(hash.replace(/^#/, ""))
      var out = {}
      params.forEach(function (value, key) { out[key] = value })
      return out
    }

    var frag = parseFragment(window.location.hash || "")
    var accessToken = frag.access_token
    var tokenType = frag.type

    var form = document.getElementById("form")
    var invalid = document.getElementById("invalid")
    var msg = document.getElementById("msg")
    var submit = document.getElementById("submit")
    var pw = document.getElementById("pw")

    // No token, wrong type — hide the form, show the error
    if (!accessToken || tokenType !== "recovery") {
      form.classList.add("hidden")
      invalid.classList.remove("hidden")
    }

    function setMsg(text, kind) {
      msg.textContent = text
      msg.className = "msg show " + kind
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault()
      submit.disabled = true
      submit.textContent = "Updating..."
      msg.className = "msg"

      try {
        var res = await fetch(SUPABASE_URL + "/auth/v1/user", {
          method: "PUT",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": "Bearer " + accessToken,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ password: pw.value }),
        })

        if (res.ok) {
          submit.textContent = "Updated"
          setMsg("Password updated. You can now close this tab and log in with your new password.", "success")
          pw.value = ""
        } else {
          var data = await res.json().catch(function () { return {} })
          submit.disabled = false
          submit.textContent = "Update password"
          setMsg(data.message || "Could not update password. Please try again.", "error")
        }
      } catch (err) {
        submit.disabled = false
        submit.textContent = "Update password"
        setMsg("Connection error. Please try again.", "error")
      }
    })
  </script>
</body>
</html>
