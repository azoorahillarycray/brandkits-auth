<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Signing you in…</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0D0D0D;
      color: #FFFFFF;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="status">Completing sign-in…</div>
  <script>
    (function () {
      const hash = window.location.hash.substring(1)
      const params = new URLSearchParams(hash)

      const access_token = params.get("access_token")
      const refresh_token = params.get("refresh_token")
      const expires_in = params.get("expires_in")
      const error = params.get("error")
      const error_description = params.get("error_description")

      const status = document.getElementById("status")

      // Open a channel that the plugin is listening on. This works
      // even when window.opener is null (which happens inside the
      // Framer plugin iframe sandbox).
      let channel = null
      try {
        channel = new BroadcastChannel("brandkits_oauth")
      } catch (e) {
        // BroadcastChannel not supported — fall back to postMessage.
      }

      function send(payload) {
        // Preferred path: BroadcastChannel.
        if (channel) {
          try {
            channel.postMessage(payload)
          } catch (e) {}
        }
        // Fallback: postMessage, in case opener survived.
        if (window.opener) {
          try {
            window.opener.postMessage(payload, "*")
          } catch (e) {}
        }
      }

      if (error) {
        status.textContent = "Sign-in failed: " + (error_description || error)
        send({ type: "supabase-oauth-error", error: error_description || error })
        setTimeout(() => window.close(), 800)
        return
      }

      if (!access_token) {
        status.textContent = "No token received. You can close this window."
        return
      }

      send({
        type: "supabase-oauth-success",
        session: {
          access_token,
          refresh_token,
          expires_in: expires_in ? parseInt(expires_in, 10) : null,
        },
      })

      // Small delay so the message has time to flush before the
      // window closes.
      setTimeout(() => window.close(), 400)
    })()
  </script>
</body>
</html>
