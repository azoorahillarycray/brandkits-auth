<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brand Kits — Sign In</title>

  <!-- Favicon. Replace favicon.svg with your own or use a .png. -->
  <link rel="icon" type="image/svg+xml" href="/brandkits-auth/favicon.svg" />
  <link rel="apple-touch-icon" href="/brandkits-auth/favicon.png" />

  <style>
    :root {
      --bg: #0D0D0D;
      --surface: #161616;
      --text: #FFFFFF;
      --text-muted: #888888;
      --text-dim: #555555;
      --accent: #13e436;
      --danger: #ff5a5a;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .logo-fallback {
      width: 24px;
      height: 24px;
      fill: #111111;
    }

    .title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin: 0;
      max-width: 300px;
    }

    .subtitle strong {
      color: var(--text);
      font-weight: 500;
    }

    /* Spinner */
    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Success / error icon */
    .status-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
      animation: pop 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .status-icon.success {
      background: var(--accent);
    }

    .status-icon.error {
      background: var(--danger);
    }

    .status-icon svg {
      width: 26px;
      height: 26px;
      display: block;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Close button */
    .btn {
      margin-top: 4px;
      padding: 11px 22px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
      display: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn.show {
      display: inline-block;
    }

    .footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img
        src="https://azoorahillarycray.github.io/brandkits-auth/icon.svg"
        alt=""
        onerror="this.style.display='none'; this.parentNode.innerHTML='<svg class=&quot;logo-fallback&quot; viewBox=&quot;0 0 24 24&quot;><path d=&quot;M20 0v8h-8L4 0ZM4 8h8l8 8h-8v8l-8-8Z&quot;/></svg>';"
      />
    </div>

    <h1 class="title" id="title">Signing you in…</h1>
    <p class="subtitle" id="subtitle">Just a moment while we connect your account.</p>

    <div class="spinner" id="spinner"></div>

    <button class="btn" id="close-btn" onclick="window.close()">Close window</button>
  </div>

  <div class="footer">Brand Kits</div>

  <script>
    (function () {
      const SUPABASE_URL = "https://bxrqzfwddzlnfompmtwo.supabase.co"
      const SUPABASE_ANON_KEY = "sb_publishable_EyLVDO_GFLbQIkzyd7_25w_XBy3glLD"
      const PROXY_API_URL = `${SUPABASE_URL}/functions/v1/api-proxy`

      const query = new URLSearchParams(window.location.search)
      const hash = new URLSearchParams(window.location.hash.substring(1))

      const access_token = hash.get("access_token")
      const refresh_token = hash.get("refresh_token")
      const error = hash.get("error") || query.get("error")
      const error_description =
        hash.get("error_description") || query.get("error_description")

      const nonce =
        query.get("nonce") ||
        hash.get("nonce") ||
        query.get("state") ||
        hash.get("state") ||
        ""

      try {
        history.replaceState(null, "", window.location.pathname)
      } catch (e) {}

      const titleEl = document.getElementById("title")
      const subtitleEl = document.getElementById("subtitle")
      const spinnerEl = document.getElementById("spinner")
      const closeBtn = document.getElementById("close-btn")

      function showClose() {
        closeBtn.classList.add("show")
      }

      function closeSoon(ms) {
        setTimeout(() => {
          try { window.close() } catch (e) {}
          showClose()
        }, ms)
      }

      function setSuccess(message) {
        spinnerEl.style.display = "none"
        titleEl.textContent = "You're signed in"
        subtitleEl.textContent = message || "You can close this window and return to the plugin."
      }

      function setError(message) {
        spinnerEl.style.display = "none"
        titleEl.textContent = "Sign-in failed"
        subtitleEl.innerHTML = message
      }

      async function store(payload) {
        for (let attempt = 0; attempt < 3; attempt++) {
          try {
            const res = await fetch(PROXY_API_URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                apikey: SUPABASE_ANON_KEY,
                Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              },
              body: JSON.stringify({
                action: "store-oauth-session",
                payload: { nonce, ...payload },
              }),
            })
            if (res.ok) return true
            if (res.status >= 400 && res.status < 500) return false
          } catch (e) {}
          await new Promise((r) => setTimeout(r, 600 * (attempt + 1)))
        }
        return false
      }

      async function run() {
        if (!nonce) {
          setError("Missing session id. Close this window and try again.")
          showClose()
          return
        }

        if (error) {
          const message = error_description || error
          await store({ error: message })
          setError(message)
          closeSoon(1500)
          return
        }

        if (!access_token) {
          setError("No token received. You can close this window.")
          showClose()
          return
        }

        const ok = await store({
          access_token,
          refresh_token: refresh_token || "",
        })

        if (!ok) {
          setError("We couldn't hand your sign-in back to the plugin. Close this window and try again.")
          showClose()
          return
        }

        setSuccess("You can close this window and return to the plugin.")
        closeSoon(600)
      }

      run()
    })()
  </script>
</body>
</html>
