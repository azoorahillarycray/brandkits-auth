<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Signing you in…</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0D0D0D;
      color: #FFFFFF;
      font-size: 14px;
    }
    .btn {
      margin-top: 16px;
      padding: 8px 16px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="status">Completing sign-in…</div>
  <button id="close-btn" class="btn" style="display: none;" onclick="window.close()">Close Window</button>

  <script>
    (function () {
      const SUPABASE_URL = "https://bxrqzfwddzlnfompmtwo.supabase.co"
      const SUPABASE_ANON_KEY = "sb_publishable_EyLVDO_GFLbQIkzyd7_25w_XBy3glLD"
      const PROXY_API_URL = `${SUPABASE_URL}/functions/v1/api-proxy`

      // Grab both the query string and the hash. Supabase returns
      // tokens in the hash (#access_token=...) but the `state`
      // param (our nonce) can land in either place depending on
      // the provider flow, so check both.
      const query = new URLSearchParams(window.location.search)
      const hash = new URLSearchParams(window.location.hash.substring(1))

      const access_token = hash.get("access_token")
      const refresh_token = hash.get("refresh_token")
      const error = hash.get("error") || query.get("error")
      const error_description =
        hash.get("error_description") || query.get("error_description")

      // Supabase passes `state` through verbatim if we set it on
      // the /authorize URL — but we actually pass the nonce via the
      // `redirect_to` query string, so check both spots.
      const nonce =
        query.get("nonce") ||
        hash.get("nonce") ||
        query.get("state") ||
        hash.get("state") ||
        ""

      const status = document.getElementById("status")
      const closeBtn = document.getElementById("close-btn")

      async function store(payload) {
        try {
          await fetch(PROXY_API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            },
            body: JSON.stringify({
              action: "store-oauth-session",
              payload: { nonce, ...payload },
            }),
          })
        } catch (e) {
          // Best effort.
        }
      }

      async function run() {
        if (!nonce) {
          status.textContent = "Missing session id. Close and try again."
          closeBtn.style.display = "block"
          return
        }

        if (error) {
          await store({ access_token: "ERROR", error: error_description || error })
          status.textContent = "Sign-in failed: " + (error_description || error)
          setTimeout(() => {
            try { window.close() } catch (e) {}
            closeBtn.style.display = "block"
          }, 600)
          return
        }

        if (!access_token) {
          status.textContent = "No token received. You can close this window."
          closeBtn.style.display = "block"
          return
        }

        await store({
          access_token,
          refresh_token: refresh_token || "",
        })

        status.textContent = "Signed in. Closing…"
        setTimeout(() => {
          try { window.close() } catch (e) {}
          closeBtn.style.display = "block"
        }, 400)
      }

      run()
    })()
  </script>
</body>
</html>
