<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/brandkits-auth/favicon.png" />
<link rel="apple-touch-icon" href="/brandkits-auth/favicon.png" />
  <title>Signing you in…</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0D0D0D;
      color: #FFFFFF;
      font-size: 14px;
      text-align: center;
      padding: 0 24px;
      box-sizing: border-box;
    }
    .btn {
      margin-top: 16px;
      padding: 8px 16px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="status">Completing sign-in…</div>
  <button id="close-btn" class="btn" style="display: none;" onclick="window.close()">Close Window</button>

  <script>
    (function () {
      const SUPABASE_URL = "https://bxrqzfwddzlnfompmtwo.supabase.co"
      const SUPABASE_ANON_KEY = "sb_publishable_EyLVDO_GFLbQIkzyd7_25w_XBy3glLD"
      const PROXY_API_URL = `${SUPABASE_URL}/functions/v1/api-proxy`

      const query = new URLSearchParams(window.location.search)
      const hash = new URLSearchParams(window.location.hash.substring(1))

      const access_token = hash.get("access_token")
      const refresh_token = hash.get("refresh_token")
      const error = hash.get("error") || query.get("error")
      const error_description =
        hash.get("error_description") || query.get("error_description")

      const nonce =
        query.get("nonce") ||
        hash.get("nonce") ||
        query.get("state") ||
        hash.get("state") ||
        ""

      // Tokens are in memory now; scrub them from the address bar and
      // history so they can't be recovered from there.
      try {
        history.replaceState(null, "", window.location.pathname)
      } catch (e) {}

      const status = document.getElementById("status")
      const closeBtn = document.getElementById("close-btn")

      function showClose() {
        closeBtn.style.display = "block"
      }

      function closeSoon(ms) {
        setTimeout(() => {
          try { window.close() } catch (e) {}
          showClose()
        }, ms)
      }

      // Returns true only if the server accepted it. Retries network
      // blips and 5xx; gives up immediately on 4xx.
      async function store(payload) {
        for (let attempt = 0; attempt < 3; attempt++) {
          try {
            const res = await fetch(PROXY_API_URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                apikey: SUPABASE_ANON_KEY,
                Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              },
              body: JSON.stringify({
                action: "store-oauth-session",
                payload: { nonce, ...payload },
              }),
            })
            if (res.ok) return true
            if (res.status >= 400 && res.status < 500) return false
          } catch (e) {}
          await new Promise((r) => setTimeout(r, 600 * (attempt + 1)))
        }
        return false
      }

      async function run() {
        if (!nonce) {
          status.textContent = "Missing session id. Close this window and try again."
          showClose()
          return
        }

        if (error) {
          const message = error_description || error
          await store({ error: message })
          status.textContent = "Sign-in failed: " + message
          closeSoon(1500)
          return
        }

        if (!access_token) {
          status.textContent = "No token received. You can close this window."
          showClose()
          return
        }

        const ok = await store({
          access_token,
          refresh_token: refresh_token || "",
        })

        if (!ok) {
          status.textContent =
            "We couldn't hand your sign-in back to the plugin. Close this window and try again."
          showClose()
          return
        }

        status.textContent = "You're signed in. You can close this window."
        closeSoon(400)
      }

      run()
    })()
  </script>
</body>
</html>
