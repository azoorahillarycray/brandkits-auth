<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Signing you in…</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0D0D0D;
      color: #FFFFFF;
      font-size: 14px;
    }
    .btn {
      margin-top: 16px;
      padding: 8px 16px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="status">Completing sign-in…</div>
  <button id="close-btn" class="btn" style="display: none;" onclick="window.close()">Close Window</button>

  <script>
    (function () {
      const hash = window.location.hash.substring(1)
      const params = new URLSearchParams(hash)

      const access_token = params.get("access_token")
      const refresh_token = params.get("refresh_token")
      const expires_in = params.get("expires_in")
      const error = params.get("error")
      const error_description = params.get("error_description")

      const status = document.getElementById("status")
      const closeBtn = document.getElementById("close-btn")

      let channel = null
      try {
        channel = new BroadcastChannel("brandkits_oauth")
      } catch (e) {}

      function sendPayload(payload) {
        // 1. BroadcastChannel (Same origin)
        if (channel) {
          try { channel.postMessage(payload) } catch (e) {}
        }
        // 2. Window Opener (Cross-origin popup -> iframe)
        if (window.opener) {
          try { window.opener.postMessage(payload, "*") } catch (e) {}
        }
      }

      if (error) {
        status.textContent = "Sign-in failed: " + (error_description || error)
        sendPayload({ type: "supabase-oauth-error", error: error_description || error })
        closeBtn.style.display = "block"
        return
      }

      if (!access_token) {
        status.textContent = "No token received. You can close this window."
        closeBtn.style.display = "block"
        return
      }

      const payload = {
        type: "supabase-oauth-success",
        session: {
          access_token,
          refresh_token: refresh_token || "",
          expires_in: expires_in ? parseInt(expires_in, 10) : null,
        },
      }

      // 3. Fallback: Save directly to localStorage for cross-tab polling
      try {
        localStorage.setItem("brandkits_oauth_session", JSON.stringify(payload.session))
      } catch (e) {}

      // Continuously broadcast until closed or ACK received
      const interval = setInterval(() => {
        sendPayload(payload)
      }, 300)

      // Listen for confirmation from Framer plugin
      window.addEventListener("message", (event) => {
        if (event.data?.type === "supabase-oauth-ack") {
          clearInterval(interval)
          status.textContent = "Signed in successfully!"
          setTimeout(() => {
            try { window.close() } catch (e) {}
            closeBtn.style.display = "block"
          }, 200)
        }
      })

      if (channel) {
        channel.onmessage = (event) => {
          if (event.data?.type === "supabase-oauth-ack") {
            clearInterval(interval)
            status.textContent = "Signed in successfully!"
            setTimeout(() => {
              try { window.close() } catch (e) {}
              closeBtn.style.display = "block"
            }, 200)
          }
        }
      }

      // Force close attempt after 3s if no ACK
      setTimeout(() => {
        clearInterval(interval)
        try { window.close() } catch (e) {}
        closeBtn.style.display = "block"
      }, 3000)
    })()
  </script>
</body>
</html>
